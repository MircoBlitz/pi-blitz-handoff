services:
  pi:
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    working_dir: /work
    command: ["sleep", "infinity"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../..:/work:ro
      - pi-sessions:/tmp/pi-sessions
      - ./models.json:/root/.pi/agent/models.json:ro
      - type: bind
        source: ${HOME}/.config/omlx/omlx-harness-sub.token
        target: /run/secrets/omlx-token
        read_only: true

volumes:
  pi-sessions:
